<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <link rel="icon" type="image/svg+xml" href="icons/bookmark.svg">
  <link rel="preload" href="fonts/geist-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="modulepreload" href="main.js">
  <link rel="modulepreload" href="modules/font-awesome.js">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <!-- Breadcrumb navigation -->
    <nav class="breadcrumb" id="breadcrumb"></nav>

    <!-- Search result count replaces the breadcrumb while searching -->
    <div class="search-results-count" id="search-results-count" aria-live="polite"></div>

    <!-- Search bar (hidden by default) -->
    <div class="search-bar" id="search-bar">
      <div class="search-icon-container" id="search-icon-container">
        <svg class="search-icon" viewBox="-85.33333333333331 -85.33333333333331 682.6666666666666 682.6666666666666" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
      </div>
      <input type="text" class="search-input" id="search-input" placeholder="Search...">
      <span class="search-result-type" id="search-result-type" hidden></span>
    </div>

    <!-- Items list -->
    <div class="list-view" id="items-grid"></div>
  </main>

  <!-- Delete confirmation modal -->
  <div class="modal-overlay" id="delete-modal-overlay">
    <div class="modal modal-small" role="dialog" aria-modal="true" aria-labelledby="delete-modal-title" aria-describedby="delete-modal-description">
      <div class="delete-modal-content">
        <div class="delete-modal-icon" id="delete-modal-icon" aria-hidden="true"></div>
        <div class="delete-modal-copy">
          <h2 class="modal-title" id="delete-modal-title">Delete folder?</h2>
          <p class="modal-text" id="delete-modal-description">0 bookmarks will be deleted</p>
        </div>
      </div>
      <button type="button" class="modal-action-btn btn-danger" id="delete-confirm-btn">Delete</button>
    </div>
  </div>

  <!-- Context menu for right-click on cards -->
  <div class="context-menu" id="context-menu">
    <button class="context-menu-item" id="context-open-all">Open all</button>
    <button class="context-menu-item" id="context-create-folder">Add folder</button>
    <button class="context-menu-item" id="context-copy-link">Copy link</button>
    <button class="context-menu-item" id="context-show-in-folder">Show in folder</button>
    <button class="context-menu-item" id="context-export">Export</button>
    <button class="context-menu-item" id="context-edit">Edit</button>
    <button class="context-menu-item" id="context-change-icon">Change icon</button>
    <button class="context-menu-item context-menu-item-danger" id="context-delete">Delete</button>
  </div>

  <div class="context-menu folder-icon-menu" id="folder-icon-menu"></div>

  <!-- Context menu for right-click on body/background -->
  <div class="context-menu" id="body-context-menu">
    <button class="context-menu-item" id="body-context-add">Add bookmark</button>
    <button class="context-menu-item" id="body-context-add-folder">Add folder</button>
    <div class="context-menu-separator" id="body-context-open-all-separator"></div>
    <button class="context-menu-item" id="body-context-open-all">Open all</button>
    <div class="context-menu-separator"></div>
    <button class="context-menu-item" id="body-context-import">Import</button>
    <button class="context-menu-item" id="body-context-export">Export</button>
    <div class="context-menu-separator"></div>
    <button class="context-menu-item" id="body-context-theme">Customize</button>
  </div>

  <!-- Theme picker panel -->
  <div class="theme-picker" id="theme-picker">
    <div class="theme-picker-content">
      <div class="theme-options">
        <button type="button" class="theme-option" data-theme="frost" aria-label="Default color">
          <span class="theme-preview theme-preview-frost" aria-hidden="true"></span>
          <span class="theme-name">Default color</span>
        </button>
        <button type="button" class="theme-option" data-theme="default" aria-label="Grey default color">
          <span class="theme-preview theme-preview-default" aria-hidden="true"></span>
          <span class="theme-name">Grey default color</span>
        </button>
        <button type="button" class="theme-option" data-theme="blue" aria-label="Blue">
          <span class="theme-preview theme-preview-blue" aria-hidden="true"></span>
          <span class="theme-name">Blue</span>
        </button>
        <button type="button" class="theme-option" data-theme="lavender" aria-label="Cool grey">
          <span class="theme-preview theme-preview-lavender" aria-hidden="true"></span>
          <span class="theme-name">Cool grey</span>
        </button>
        <button type="button" class="theme-option" data-theme="slate" aria-label="Grey">
          <span class="theme-preview theme-preview-slate" aria-hidden="true"></span>
          <span class="theme-name">Grey</span>
        </button>
        <button type="button" class="theme-option" data-theme="mint" aria-label="Aqua">
          <span class="theme-preview theme-preview-mint" aria-hidden="true"></span>
          <span class="theme-name">Aqua</span>
        </button>
        <button type="button" class="theme-option" data-theme="sage" aria-label="Green">
          <span class="theme-preview theme-preview-sage" aria-hidden="true"></span>
          <span class="theme-name">Green</span>
        </button>
        <button type="button" class="theme-option" data-theme="sand" aria-label="Viridian">
          <span class="theme-preview theme-preview-sand" aria-hidden="true"></span>
          <span class="theme-name">Viridian</span>
        </button>
        <button type="button" class="theme-option" data-theme="amber" aria-label="Citron">
          <span class="theme-preview theme-preview-amber" aria-hidden="true"></span>
          <span class="theme-name">Citron</span>
        </button>
        <button type="button" class="theme-option" data-theme="terra" aria-label="Orange">
          <span class="theme-preview theme-preview-terra" aria-hidden="true"></span>
          <span class="theme-name">Orange</span>
        </button>
        <button type="button" class="theme-option" data-theme="mocha" aria-label="Apricot">
          <span class="theme-preview theme-preview-mocha" aria-hidden="true"></span>
          <span class="theme-name">Apricot</span>
        </button>
        <button type="button" class="theme-option" data-theme="rose" aria-label="Rose">
          <span class="theme-preview theme-preview-rose" aria-hidden="true"></span>
          <span class="theme-name">Rose</span>
        </button>
        <button type="button" class="theme-option" data-theme="blush" aria-label="Pink">
          <span class="theme-preview theme-preview-blush" aria-hidden="true"></span>
          <span class="theme-name">Pink</span>
        </button>
        <button type="button" class="theme-option" data-theme="orchid" aria-label="Fuchsia">
          <span class="theme-preview theme-preview-orchid" aria-hidden="true"></span>
          <span class="theme-name">Fuchsia</span>
        </button>
        <button type="button" class="theme-option" data-theme="violet" aria-label="Violet">
          <span class="theme-preview theme-preview-violet" aria-hidden="true"></span>
          <span class="theme-name">Violet</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Hidden file input for import -->
  <input type="file" id="import-file-input" accept=".html,.htm" style="display: none;">

  <script type="module" src="main.js"></script>
</body>
</html>
